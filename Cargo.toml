[package]
name = "runki"
version = "0.1.0"
edition = "2021"
description = "A minimal Anki deck viewer: spacebar through cards, flag some for later. No spaced repetition."
license = "MIT"

[dependencies]
anyhow = "1"
csv = "1"
eframe = "0.31"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = "2"
zstd = "0.13"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
zip = "2"
zstd = "0.13"

[profile.release]
opt-level = 2
