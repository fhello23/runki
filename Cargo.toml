[package]
name = "runki"
version = "0.3.5"
edition = "2021"
description = "A minimal Anki deck viewer: spacebar through cards, flag some for later. No spaced repetition."
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
csv = "1"
dirs = "6"
eframe = { version = "0.31", features = ["persistence"], optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rfd = { version = "0.15", optional = true }
ron = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = "2"
zstd = "0.13"

# The macOS About panel and web menu (src/about_macos.rs). Already in the
# tree via eframe and rfd; only the AppKit classes these controls use are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSAttributedString",
    "NSColor",
    "NSCell",
    "NSFont",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSResponder",
    "NSText",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSObject",
    "NSRange",
    "NSString",
    "NSURL",
] }

[profile.release]
opt-level = 2
