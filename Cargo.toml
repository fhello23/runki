[package]
name = "runki"
version = "0.1.0"
edition = "2021"
description = "A minimal Anki deck viewer: spacebar through cards, flag some for later. No spaced repetition."
license = "MIT"

[dependencies]
anyhow = "1"
csv = "1"
eframe = "0.31"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = "2"
zstd = "0.13"

# The macOS "About Runki" panel (src/about_macos.rs). Already in the tree via
# eframe and rfd; only the AppKit classes the panel uses are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSAttributedString",
    "NSColor",
    "NSFont",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSResponder",
    "NSText",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSObject",
    "NSRange",
    "NSString",
    "NSURL",
] }

[profile.release]
opt-level = 2
